  <path d="M190 296 H214 V320" fill="none" stroke="#1e293b" stroke-width="3"/>
  <path d="M110 320 H410" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
<g fill="none" stroke="#2563eb" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(248.8 368.0) scale(1.6)"><circle cx="5.5" cy="-5.5" r="5.5"/><path d="M0 -20 V0"/></g></g>
