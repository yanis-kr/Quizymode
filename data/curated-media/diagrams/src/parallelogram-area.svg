<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img">
  <title>Parallelogram with base b and perpendicular height h</title>
  <desc>A parallelogram. Its bottom side is the base, labelled b. A dashed line drops straight down from the top side to the base, meeting it at a right angle. This perpendicular distance is the height, labelled h.</desc>
