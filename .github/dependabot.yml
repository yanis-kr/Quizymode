version: 2
updates:
  - package-ecosystem: npm
    directory: /src/Quizymode.Web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # React Compiler lint rules from these versions flag ~34 existing components; refactor tracked in #425.
      - dependency-name: eslint-plugin-react-hooks
        versions: [">=7.1.0"]
      - dependency-name: eslint-plugin-react-refresh
        versions: [">=0.5.0"]
      # Node type majors track Node releases; CI and deploy run Node 22, so majors are taken with a Node upgrade.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # vitest and its coverage provider must share a major, so they always update together.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
