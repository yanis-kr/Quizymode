name: Publish User Guide

# The capture signs in as the test user and sends ~250-300 authenticated page views per run to prod
# (#333). It no longer runs after every Deploy: once a day it captures only when guide-relevant files
# changed since the last successful run. Use workflow_dispatch to publish immediately.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      expected_build_version:
        description: Optional exact build version to wait for before capturing screenshots.
        required: false
        type: string
      force:
        description: Capture even when no guide-relevant files changed since the last successful run.
        required: false
        type: boolean
        default: true

concurrency:
  group: user-guide-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      capture: ${{ steps.decide.outputs.capture }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether the guide needs a new capture
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' }}
        run: |
          if [[ "${FORCE}" == "true" ]]; then
            echo "Manual run with force=true: capturing."
            echo "capture=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          LAST_SHA="$(gh run list --workflow user-guide-pages.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // empty')"
          if [[ -z "${LAST_SHA}" ]] || ! git cat-file -e "${LAST_SHA}^{commit}" 2>/dev/null; then
            echo "No usable previous successful run (${LAST_SHA:-none}): capturing."
            echo "capture=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Version-only bumps of package.json / package-lock.json and unit tests do not change screenshots.
          GUIDE_PATHS=(
            'src/Quizymode.Web/src/**'
            'src/Quizymode.Web/public/**'
            'src/Quizymode.Web/index.html'
            'src/Quizymode.Web/tailwind.config.*'
            'src/Quizymode.Web/vite.config.*'
            'playwright/screenshots/**'
            'playwright/fixtures.ts'
            'playwright.config.ts'
            'scripts/build-user-guide-site.js'
            'scripts/wait-for-production-ready.js'
            '.github/workflows/user-guide-pages.yml'
          )
          CHANGED="$(git diff --name-only "${LAST_SHA}" HEAD -- "${GUIDE_PATHS[@]}" | grep -Ev '\.test\.(ts|tsx)$' || true)"

          if [[ -z "${CHANGED}" ]]; then
            echo "No guide-relevant changes since ${LAST_SHA:0:7}: skipping capture."
            echo "capture=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Guide-relevant changes since ${LAST_SHA:0:7}:"
            echo "${CHANGED}"
            echo "capture=true" >> "${GITHUB_OUTPUT}"
          fi

  build-guide:
    needs: changes
    if: ${{ needs.changes.outputs.capture == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Resolve expected live build
        id: expected_build
        shell: bash
        env:
          MANUAL_EXPECTED_BUILD_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.expected_build_version || '' }}
        run: |
          # Scheduled runs capture whatever build is live; a manual run may pin an exact build.
          EXPECTED_BUILD_VERSION="${MANUAL_EXPECTED_BUILD_VERSION}"

          echo "value=${EXPECTED_BUILD_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved expected build version: ${EXPECTED_BUILD_VERSION:-<any live build marker>}"

      - name: Wait for live production readiness
        id: readiness
        env:
          USER_GUIDE_BASE_URL: https://www.quizymode.com/
          USER_GUIDE_EXPECTED_BUILD_VERSION: ${{ steps.expected_build.outputs.value }}
          USER_GUIDE_READY_TIMEOUT_SECONDS: 900
          USER_GUIDE_READY_INTERVAL_SECONDS: 15
        run: node scripts/wait-for-production-ready.js

      - name: Capture live production screenshots
        env:
          PLAYWRIGHT_BASE_URL: https://www.quizymode.com/
          TEST_USER_EMAIL: ${{ vars.TEST_USER_EMAIL || secrets.TEST_USER_EMAIL || 'test-user@quizymode.com' }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || secrets.QM_AGENT_USER_TEST_PWD }}
          USER_GUIDE_SCREENSHOT_ROOT: ${{ runner.temp }}/user-guide-screenshots
        run: |
          if [ -z "${TEST_USER_PASSWORD}" ]; then
            echo "TEST_USER_PASSWORD (or legacy QM_AGENT_USER_TEST_PWD) is required to capture the user guide." >&2
            exit 1
          fi

          npx playwright test --project=screenshots --project=screenshots-mobile

      - name: Build static user-guide site
        env:
          USER_GUIDE_BASE_URL: https://www.quizymode.com/
          USER_GUIDE_SCREENSHOT_ROOT: ${{ runner.temp }}/user-guide-screenshots
          USER_GUIDE_SITE_OUTPUT_DIR: ${{ runner.temp }}/user-guide-pages
          USER_GUIDE_DEPLOYED_BUILD_VERSION: ${{ steps.readiness.outputs.live_build_version }}
        run: node scripts/build-user-guide-site.js

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: user-guide-debug-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/user-guide-screenshots
            playwright-report
            playwright/test-results
          retention-days: 3

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/user-guide-pages

  deploy-pages:
    needs: build-guide
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
