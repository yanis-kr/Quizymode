name: Rollback

on:
  workflow_dispatch:
    inputs:
      previous_sha:
        description: Main SHA whose API image to restore (CI builds an API image only for commits that change the API)
        required: true
        type: string
      failed_sha:
        description: Failed merge SHA being rolled back
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  validate-input:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable SHAs
        env:
          PREVIOUS_SHA: ${{ inputs.previous_sha }}
          FAILED_SHA: ${{ inputs.failed_sha }}
        run: |
          [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FAILED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$PREVIOUS_SHA" != "$FAILED_SHA" ]

  rollback-container:
    needs: validate-input
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Settings come from the checked-in file in the failed commit's tree, plus the SSM bootstrap pair read now (#785).
      # Rollback restores the old image only; it never copies the active deployment's environment or old secrets.
      - name: Check out the Lightsail settings file
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.failed_sha }}
          sparse-checkout: infra/lightsail
          persist-credentials: false

      - name: Build container environment
        run: |
          umask 077
          ENV_FILE="$RUNNER_TEMP/env.json"
          ACCESS_FILE="$RUNNER_TEMP/bootstrap-access"
          SECRET_FILE="$RUNNER_TEMP/bootstrap-secret"
          aws ssm get-parameter --name /quizymode/deploy/BootstrapAccessKeyId --with-decryption \
            --query Parameter.Value --output text > "$ACCESS_FILE"
          aws ssm get-parameter --name /quizymode/deploy/BootstrapSecretAccessKey --with-decryption \
            --query Parameter.Value --output text > "$SECRET_FILE"
          while IFS= read -r value; do [ -n "$value" ] && echo "::add-mask::$value"; done < "$ACCESS_FILE"
          while IFS= read -r value; do [ -n "$value" ] && echo "::add-mask::$value"; done < "$SECRET_FILE"
          jq --rawfile access "$ACCESS_FILE" --rawfile secret "$SECRET_FILE" \
            '. + {APP_Config__Ssm__AccessKeyId: ($access | rtrimstr("\n")), APP_Config__Ssm__SecretAccessKey: ($secret | rtrimstr("\n"))}' \
            infra/lightsail/env.prod.json > "$ENV_FILE"
          rm -f "$ACCESS_FILE" "$SECRET_FILE"

      - name: Restore previous API image
        env:
          IMAGE: ghcr.io/yanis-kr/quizymode:${{ inputs.previous_sha }}
        run: |
          umask 077
          CONTAINERS=$(jq -n \
            --arg image "$IMAGE" \
            --slurpfile env "$RUNNER_TEMP/env.json" \
            '{api: {image: $image, environment: $env[0], ports: {"8080": "HTTP"}}}')

          # The CLI echoes the whole deployment, environment included: stdout is discarded and only a sanitized
          # error line is printed.
          if ! aws lightsail create-container-service-deployment \
            --service-name container-service-1 \
            --containers "$CONTAINERS" \
            --public-endpoint '{
              "containerName": "api",
              "containerPort": 8080,
              "healthCheck": {
                "path": "/health",
                "intervalSeconds": 10,
                "timeoutSeconds": 5,
                "successCodes": "200-299",
                "unhealthyThreshold": 2,
                "healthyThreshold": 2
              }
            }' > /dev/null 2> /tmp/create-error.txt; then
            sed -n 's/^\(An error occurred ([A-Za-z]*) when calling the [A-Za-z]* operation\).*/\1/p' /tmp/create-error.txt | head -n 1
            echo "::error::create-container-service-deployment failed (details withheld: the CLI can echo the environment)."
            exit 1
          fi

      - name: Wait for API rollback
        run: |
          for i in $(seq 1 40); do
            STATE=$(aws lightsail get-container-service-deployments \
              --service-name container-service-1 \
              --query 'deployments[0].state' --output text)
            echo "[$i/40] state=$STATE"
            [ "$STATE" = "ACTIVE" ] && exit 0
            [ "$STATE" = "FAILED" ] && exit 1
            sleep 15
          done
          exit 1

      - name: Remove temporary environment files
        if: always()
        run: rm -f "$RUNNER_TEMP/env.json" "$RUNNER_TEMP/bootstrap-access" "$RUNNER_TEMP/bootstrap-secret" /tmp/create-error.txt

  rollback-ui:
    needs: rollback-container
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout previous release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.previous_sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Quizymode.Web/package-lock.json

      - name: Build previous UI
        working-directory: src/Quizymode.Web
        env:
          VITE_GIT_SHA: ${{ inputs.previous_sha }}
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Restore S3 site
        working-directory: src/Quizymode.Web/dist
        run: |
          aws s3 sync . s3://quizymode-web/ --delete --exact-timestamps --exclude "*.webp"
          # Curated question pictures (#407) — content-addressed (assets/m/<hash>.webp), so immutable; explicit content-type
          aws s3 sync . s3://quizymode-web/ \
            --exclude "*" --include "*.webp" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "image/webp"
          aws cloudfront create-invalidation \
            --distribution-id EH1DS9REH8KR5 \
            --paths "/*"
