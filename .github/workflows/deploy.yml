name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # AC 7.11.2: reads the change scope CI computed for this commit. A missing or unreadable scope deploys everything.
  scope:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      web: ${{ steps.read.outputs.web }}
      api: ${{ steps.read.outputs.api }}
    steps:
      - name: Download change scope
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: change-scope
          # Outside the checkout: actions/checkout below cleans untracked files, which deleted a workspace copy.
          path: ${{ runner.temp }}/change-scope
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Only the reader script is needed; it is tested in scripts/tests/read-change-scope.test.mjs.
      - name: Check out the scope reader
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Read change scope
        id: read
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          DOWNLOADED: ${{ steps.download.outcome }}
          SCOPE_FILE: ${{ runner.temp }}/change-scope/change-scope.json
        run: |
          FILE=""
          if [ "$DOWNLOADED" = "success" ] && [ -f "$SCOPE_FILE" ]; then
            FILE="$SCOPE_FILE"
          else
            echo "No change scope found; deploying everything."
          fi
          # Prints "web=<bool> api=<bool>"; only an explicit false turns a flag off.
          read -r WEB_KV API_KV <<< "$(node scripts/ci/read-change-scope.mjs "$FILE")"
          WEB="${WEB_KV#web=}"
          API="${API_KV#api=}"
          echo "web=${WEB}" >> "${GITHUB_OUTPUT}"
          echo "api=${API}" >> "${GITHUB_OUTPUT}"
          echo "Deploying: web=${WEB} api=${API}"
          if [ "$WEB" = "false" ] && [ "$API" = "false" ]; then
            echo "Nothing to deploy for ${SHA}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Scope for ${SHA}: web=${WEB} api=${API}" >> "${GITHUB_STEP_SUMMARY}"
          fi

  deploy-container:
    needs: scope
    if: ${{ github.event.workflow_run.conclusion == 'success' && needs.scope.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # The settings file ships with the same commit as the image (#785).
      - name: Check out the Lightsail settings file
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: infra/lightsail
          persist-credentials: false

      # AC 7.11.8: fail in seconds when CI built no image for this commit, instead of waiting for Lightsail to time out.
      - name: Check the API image exists
        env:
          IMAGE: ghcr.io/yanis-kr/quizymode:${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin >/dev/null
          if ! docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::No API image $IMAGE on GHCR. CI built none for this commit, so the deployment is not started."
            exit 1
          fi

      # Settings come from the checked-in infra/lightsail/env.prod.json plus the two SSM bootstrap values (#785).
      # Nothing is copied from the active deployment. The bootstrap values go to private temp files and are masked
      # before use; they are never printed (AC 7.11.20).
      - name: Build container environment
        run: |
          umask 077
          ENV_FILE="$RUNNER_TEMP/env.json"
          ACCESS_FILE="$RUNNER_TEMP/bootstrap-access"
          SECRET_FILE="$RUNNER_TEMP/bootstrap-secret"
          aws ssm get-parameter --name /quizymode/deploy/BootstrapAccessKeyId --with-decryption \
            --query Parameter.Value --output text > "$ACCESS_FILE"
          aws ssm get-parameter --name /quizymode/deploy/BootstrapSecretAccessKey --with-decryption \
            --query Parameter.Value --output text > "$SECRET_FILE"
          while IFS= read -r value; do [ -n "$value" ] && echo "::add-mask::$value"; done < "$ACCESS_FILE"
          while IFS= read -r value; do [ -n "$value" ] && echo "::add-mask::$value"; done < "$SECRET_FILE"
          jq --rawfile access "$ACCESS_FILE" --rawfile secret "$SECRET_FILE" \
            '. + {APP_Config__Ssm__AccessKeyId: ($access | rtrimstr("\n")), APP_Config__Ssm__SecretAccessKey: ($secret | rtrimstr("\n"))}' \
            infra/lightsail/env.prod.json > "$ENV_FILE"
          rm -f "$ACCESS_FILE" "$SECRET_FILE"

      - name: Create LightSail deployment
        env:
          IMAGE: ghcr.io/yanis-kr/quizymode:${{ github.event.workflow_run.head_sha }}
        run: |
          umask 077
          CONTAINERS=$(jq -n \
            --arg image "$IMAGE" \
            --slurpfile env "$RUNNER_TEMP/env.json" \
            '{api: {image: $image, environment: $env[0], ports: {"8080": "HTTP"}}}')

          # The CLI echoes the whole deployment, environment included: stdout is discarded and only a sanitized
          # error line is printed (a parameter error can echo the --containers JSON, so raw stderr is never shown).
          if ! aws lightsail create-container-service-deployment \
            --service-name container-service-1 \
            --containers "$CONTAINERS" \
            --public-endpoint '{
              "containerName": "api",
              "containerPort": 8080,
              "healthCheck": {
                "path": "/health",
                "intervalSeconds": 10,
                "timeoutSeconds": 5,
                "successCodes": "200-299",
                "unhealthyThreshold": 6,
                "healthyThreshold": 2
              }
            }' > /dev/null 2> /tmp/create-error.txt; then
            sed -n 's/^\(An error occurred ([A-Za-z]*) when calling the [A-Za-z]* operation\).*/\1/p' /tmp/create-error.txt | head -n 1
            echo "::error::create-container-service-deployment failed (details withheld: the CLI can echo the environment)."
            exit 1
          fi

      - name: Wait for deployment to become ACTIVE
        run: |
          for i in $(seq 1 40); do
            STATE=$(aws lightsail get-container-service-deployments \
              --service-name container-service-1 \
              --query 'deployments[0].state' --output text)
            echo "[$i/40] state=$STATE"
            [ "$STATE" = "ACTIVE" ] && exit 0
            [ "$STATE" = "FAILED" ] && { echo "Deployment FAILED"; exit 1; }
            sleep 15
          done
          echo "Timed out after 10 minutes"
          exit 1

      # Log lines only (never environment or deployment settings). Best effort: must not mask the original failure.
      - name: Show recent API container logs
        if: failure()
        continue-on-error: true
        run: |
          aws lightsail get-container-log \
            --service-name container-service-1 \
            --container-name api \
            --output json \
            | jq -r '.logEvents[]? | "\(.createdAt) \(.message)"' \
            | tail -n 100 || true

      - name: Remove temporary environment files
        if: always()
        run: rm -f "$RUNNER_TEMP/env.json" "$RUNNER_TEMP/bootstrap-access" "$RUNNER_TEMP/bootstrap-secret" /tmp/create-error.txt

  # Builds the web app while the container deploys, so deploy-ui only has to sync it.
  build-ui:
    needs: scope
    if: ${{ github.event.workflow_run.conclusion == 'success' && needs.scope.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Quizymode.Web/package-lock.json

      - name: Build web app
        working-directory: src/Quizymode.Web
        env:
          VITE_GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          npm ci
          npm run build

      # Hidden source maps (OBS-001) are kept as an artifact of the deployed build and never uploaded to S3.
      - name: Upload deployed web source maps
        uses: actions/upload-artifact@v7
        with:
          name: deployed-web-sourcemaps-${{ github.event.workflow_run.head_sha }}
          path: src/Quizymode.Web/dist/**/*.map
          if-no-files-found: warn
          retention-days: 90

      # include-hidden-files keeps dist/.well-known, which upload-artifact drops by default.
      - name: Upload web build for deploy-ui
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: |
            src/Quizymode.Web/dist
            !src/Quizymode.Web/dist/**/*.map
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Runs after the container is ACTIVE so the new UI never calls the previous API.
  deploy-ui:
    needs: [scope, deploy-container, build-ui]
    # deploy-container may be skipped (web-only change); it must not have failed.
    if: ${{ !cancelled() && needs.scope.outputs.web == 'true' && needs.build-ui.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.deploy-container.result) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download web build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: src/Quizymode.Web/dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3
        working-directory: src/Quizymode.Web/dist
        run: |
          # *.js and *.css are excluded from --delete on purpose: lazy route chunks (PERF-001) are fetched on demand,
          # so tabs still running an older index.html must keep finding the earlier hashed chunks after a deploy.
          # General assets — long-lived immutable cache. Source maps (*.map) are never published (OBS-001).
          aws s3 sync . s3://quizymode-web/ \
            --delete --exact-timestamps \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" --exclude "*.json" --exclude "*.css" --exclude "*.js" \
            --exclude "*.map" --exclude "*.webp" --exclude "og-image.png" --exclude "og-card.png"

          # Curated question pictures (#407) — content-addressed (assets/m/<hash>.webp), so immutable; explicit content-type
          aws s3 sync . s3://quizymode-web/ \
            --exclude "*" --include "*.webp" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "image/webp"

          # CSS — explicit content-type (required for Safari iOS)
          aws s3 sync . s3://quizymode-web/ \
            --exclude "*" --include "*.css" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "text/css"

          # JS — explicit content-type
          aws s3 sync . s3://quizymode-web/ \
            --exclude "*" --include "*.js" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "application/javascript"

          # HTML — never cache
          aws s3 sync . s3://quizymode-web/ \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

          # JSON — never cache
          aws s3 sync . s3://quizymode-web/ \
            --exclude "*" --include "*.json" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json"

          # Social preview image — stable URL, so short cache; crawlers need an explicit image/png type
          aws s3 cp og-image.png s3://quizymode-web/og-image.png \
            --cache-control "public, max-age=86400" \
            --content-type "image/png"

          # Byte-identical copy at a second stable URL (#153): the tags point here so link-preview caches that stored
          # "no image" for the original path can refetch. Same short cache and explicit content type.
          aws s3 cp og-card.png s3://quizymode-web/og-card.png \
            --cache-control "public, max-age=86400" \
            --content-type "image/png"

          [ -f robots.txt ] && aws s3 cp robots.txt s3://quizymode-web/robots.txt \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/plain"

          [ -f llms.txt ] && aws s3 cp llms.txt s3://quizymode-web/llms.txt \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/plain; charset=utf-8"

          [ -f sitemap.xml ] && aws s3 cp sitemap.xml s3://quizymode-web/sitemap.xml \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/xml"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EH1DS9REH8KR5 \
            --paths "/*"

  # AC 7.10.5: signed-in checks on the deployed site. The report and screenshots are the evidence for
  # `signed-in-prod-ui` ACs. continue-on-error keeps a failed check from marking the deploy itself as failed;
  # the failure is still visible on this job and in the report.
  prod-verify:
    needs: [scope, deploy-container, deploy-ui]
    # Nothing deployed (skills or docs only) means nothing to verify.
    if: ${{ !cancelled() && (needs.scope.outputs.web == 'true' || needs.scope.outputs.api == 'true') && contains(fromJSON('["success","skipped"]'), needs.deploy-container.result) && contains(fromJSON('["success","skipped"]'), needs.deploy-ui.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # The site reports "<version>+sha.<7-char commit>" in its quizymode-build-version meta tag, so the wait only
      # applies when this deploy shipped the web build. An API-only deploy already waited for ACTIVE in deploy-container.
      - name: Wait for the deployed version
        if: ${{ needs.scope.outputs.web == 'true' }}
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION=$(grep -oP '(?<=<QuizymodeVersion>)[^<]+' Directory.Build.props)
          node scripts/wait-for-production-ready.js --expected-build-version "${VERSION}+sha.${HEAD_SHA:0:7}"

      - name: Run prod verification
        env:
          PLAYWRIGHT_BASE_URL: https://www.quizymode.com
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        run: npx playwright test --project=prod-verify

      # playwright/.auth/ (the saved sign-ins) is deliberately not uploaded.
      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prod-verify-${{ github.event.workflow_run.head_sha }}
          path: |
            playwright/test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 30
