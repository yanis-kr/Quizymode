name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy-container:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch environment variables from active deployment
        run: |
          aws lightsail get-container-service-deployments \
            --service-name container-service-1 \
            --query 'deployments[?state==`ACTIVE`] | [0].containers.api.environment' \
            --output json > /tmp/env.json

          # Fall back to most recent deployment if none is currently ACTIVE
          if [ "$(cat /tmp/env.json)" = "null" ]; then
            aws lightsail get-container-service-deployments \
              --service-name container-service-1 \
              --query 'deployments[0].containers.api.environment' \
              --output json > /tmp/env.json
          fi

      - name: Create LightSail deployment
        env:
          IMAGE: ghcr.io/yanis-kr/quizymode:${{ github.event.workflow_run.head_sha }}
        run: |
          CONTAINERS=$(jq -n \
            --arg image "$IMAGE" \
            --slurpfile env /tmp/env.json \
            '{api: {image: $image, environment: $env[0], ports: {"8080": "HTTP"}}}')

          aws lightsail create-container-service-deployment \
            --service-name container-service-1 \
            --containers "$CONTAINERS" \
            --public-endpoint '{
              "containerName": "api",
              "containerPort": 8080,
              "healthCheck": {
                "path": "/health",
                "intervalSeconds": 10,
                "timeoutSeconds": 5,
                "successCodes": "200-299",
                "unhealthyThreshold": 2,
                "healthyThreshold": 2
              }
            }'

      - name: Wait for deployment to become ACTIVE
        run: |
          for i in $(seq 1 40); do
            STATE=$(aws lightsail get-container-service-deployments \
              --service-name container-service-1 \
              --query 'deployments[0].state' --output text)
            echo "[$i/40] state=$STATE"
            [ "$STATE" = "ACTIVE" ] && exit 0
            [ "$STATE" = "FAILED" ] && { echo "Deployment FAILED"; exit 1; }
            sleep 15
          done
          echo "Timed out after 10 minutes"
          exit 1

  # Builds the web app while the container deploys, so deploy-ui only has to sync it.
  build-ui:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Quizymode.Web/package-lock.json

      - name: Build web app
        working-directory: src/Quizymode.Web
        env:
          VITE_GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          npm ci
          npm run build

      # Hidden source maps (OBS-001) are kept as an artifact of the deployed build and never uploaded to S3.
      - name: Upload deployed web source maps
        uses: actions/upload-artifact@v7
        with:
          name: deployed-web-sourcemaps-${{ github.event.workflow_run.head_sha }}
          path: src/Quizymode.Web/dist/**/*.map
          if-no-files-found: warn
          retention-days: 90

      # include-hidden-files keeps dist/.well-known, which upload-artifact drops by default.
      - name: Upload web build for deploy-ui
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: |
            src/Quizymode.Web/dist
            !src/Quizymode.Web/dist/**/*.map
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Runs after the container is ACTIVE so the new UI never calls the previous API.
  deploy-ui:
    needs: [deploy-container, build-ui]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download web build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: src/Quizymode.Web/dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3
        working-directory: src/Quizymode.Web/dist
        run: |
          # *.js and *.css are excluded from --delete on purpose: lazy route chunks (PERF-001) are fetched on demand,
          # so tabs still running an older index.html must keep finding the earlier hashed chunks after a deploy.
          # General assets — long-lived immutable cache. Source maps (*.map) are never published (OBS-001).
          aws s3 sync . s3://quizymode-web/ \
            --delete --exact-timestamps \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" --exclude "*.json" --exclude "*.css" --exclude "*.js" \
            --exclude "*.map" --exclude "*.webp" --exclude "og-image.png" --exclude "og-card.png"

          # Curated question pictures (#407) — content-addressed (assets/m/<hash>.webp), so immutable; explicit content-type
          aws s3 sync . s3://quizymode-web/ \
            --exclude "*" --include "*.webp" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "image/webp"

          # CSS — explicit content-type (required for Safari iOS)
          aws s3 sync . s3://quizymode-web/ \
            --exclude "*" --include "*.css" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "text/css"

          # JS — explicit content-type
          aws s3 sync . s3://quizymode-web/ \
            --exclude "*" --include "*.js" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "application/javascript"

          # HTML — never cache
          aws s3 sync . s3://quizymode-web/ \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

          # JSON — never cache
          aws s3 sync . s3://quizymode-web/ \
            --exclude "*" --include "*.json" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json"

          # Social preview image — stable URL, so short cache; crawlers need an explicit image/png type
          aws s3 cp og-image.png s3://quizymode-web/og-image.png \
            --cache-control "public, max-age=86400" \
            --content-type "image/png"

          # Byte-identical copy at a second stable URL (#153): the tags point here so link-preview caches that stored
          # "no image" for the original path can refetch. Same short cache and explicit content type.
          aws s3 cp og-card.png s3://quizymode-web/og-card.png \
            --cache-control "public, max-age=86400" \
            --content-type "image/png"

          [ -f robots.txt ] && aws s3 cp robots.txt s3://quizymode-web/robots.txt \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/plain"

          [ -f llms.txt ] && aws s3 cp llms.txt s3://quizymode-web/llms.txt \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/plain; charset=utf-8"

          [ -f sitemap.xml ] && aws s3 cp sitemap.xml s3://quizymode-web/sitemap.xml \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/xml"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EH1DS9REH8KR5 \
            --paths "/*"

  # AC 7.10.5: signed-in checks on the deployed site. The report and screenshots are the evidence for
  # `signed-in-prod-ui` ACs. continue-on-error keeps a failed check from marking the deploy itself as failed;
  # the failure is still visible on this job and in the report.
  prod-verify:
    needs: deploy-ui
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for the deployed version
        run: |
          VERSION=$(grep -oP '(?<=<QuizymodeVersion>)[^<]+' Directory.Build.props)
          node scripts/wait-for-production-ready.js --expected-build-version "$VERSION"

      - name: Run prod verification
        env:
          PLAYWRIGHT_BASE_URL: https://www.quizymode.com
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        run: npx playwright test --project=prod-verify

      # playwright/.auth/ (the saved sign-ins) is deliberately not uploaded.
      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prod-verify-${{ github.event.workflow_run.head_sha }}
          path: |
            playwright/test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 30
