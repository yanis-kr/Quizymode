name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: quizymode

jobs:
  automation-contract:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Pester 4.x (legacy Should syntax; Pester 5 removes it)
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -lt 5 })) {
            Install-Module -Name Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser
          }

      - name: Run automation contract tests
        shell: powershell
        run: .\scripts\automation\Run-Tests.ps1

  cognito-presignup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/cognito-presignup
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cognito-presignup/package-lock.json

      - name: Install
        run: npm ci

      - name: Test Pre sign-up Lambda
        run: npm test

  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          APP_VERSION="$(grep -oPm1 '(?<=<QuizymodeVersion>)[^<]+' Directory.Build.props)"
          echo "app_version=${APP_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Quizymode.Web/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Quizymode.sln

      - name: Build web app
        working-directory: src/Quizymode.Web
        run: |
          npm ci
          npm run build
          npm run check:curated-images

      - name: Check curated flag image manifest (offline)
        run: |
          npm ci
          npm run check:flag-images

      - name: Check curated explanation diagram manifest (offline)
        run: npm run check:diagram-images

      # Hidden source maps (OBS-001): never deployed, kept per version for decoding reported stacks by hand.
      - name: Upload web source maps
        uses: actions/upload-artifact@v7
        with:
          name: web-sourcemaps-${{ steps.app_version.outputs.app_version }}-${{ github.run_number }}
          path: src/Quizymode.Web/dist/**/*.map
          if-no-files-found: error
          retention-days: 90

      - name: Lint frontend
        working-directory: src/Quizymode.Web
        run: npm run lint

      - name: Run frontend tests with coverage
        working-directory: src/Quizymode.Web
        run: npm run test:coverage

      - name: Verify OpenAPI artifact is in sync (warning mode)
        id: verify_openapi
        shell: pwsh
        run: ./scripts/verify-openapi.ps1 -Configuration Release -WarnOnlyOnArtifactDiff -DiffOutputPath openapi-artifact.diff

      - name: Comment on OpenAPI drift
        if: github.event_name == 'pull_request' && steps.verify_openapi.outputs.artifact_diff_detected == 'true'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          OPENAPI_DIFF_PATH: ${{ steps.verify_openapi.outputs.artifact_diff_path }}
        with:
          script: |
            const fs = require('fs');

            try {
              const marker = '<!-- openapi-artifact-drift -->';
              const diffPath = process.env.OPENAPI_DIFF_PATH;
              const rawDiff = fs.existsSync(diffPath)
                ? fs.readFileSync(diffPath, 'utf8')
                : 'Diff file was not produced by verify-openapi.ps1.';
              const maxLength = 60000;
              const diff = rawDiff.length > maxLength
                ? `${rawDiff.slice(0, maxLength)}\n... diff truncated ...`
                : rawDiff;

              const body = `${marker}
              Warning: the generated OpenAPI artifact drifted from the committed \`docs/openapi/quizymode-api.json\` file during CI.

              This warning is non-blocking on pull requests, but the generated artifact should still be regenerated and committed before merge.

              Run:
              \`\`\`powershell
              ./scripts/verify-openapi.ps1 -Configuration Release
              \`\`\`

              <details>
              <summary>OpenAPI diff</summary>

              \`\`\`diff
              ${diff}
              \`\`\`
              </details>`;

              const { owner, repo } = context.repo;
              const issue_number = context.issue.number;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100
              });

              const existing = comments.find(comment =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker)
              );

              const normalize = text => (text ?? '').replace(/\r\n/g, '\n').trim();
              if (existing && normalize(existing.body) === normalize(body)) {
                console.log(`Comment ${existing.id} already up to date; not rewriting it.`);
                return;
              }

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body
                });
                return;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            } catch (error) {
              console.log(`Skipping OpenAPI drift comment: ${error.message}`);
            }

      - name: Clear OpenAPI drift comment
        if: github.event_name == 'pull_request' && steps.verify_openapi.outputs.artifact_diff_detected != 'true'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            try {
              const marker = '<!-- openapi-artifact-drift -->';
              const { owner, repo } = context.repo;
              const issue_number = context.issue.number;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100
              });

              const existing = comments.find(comment =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker)
              );

              if (!existing) {
                return;
              }

              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: existing.id
              });
            } catch (error) {
              console.log(`Skipping OpenAPI drift comment cleanup: ${error.message}`);
            }

      - name: Run architecture tests
        run: |
          dotnet test tests/Quizymode.Api.Tests/Quizymode.Api.Tests.csproj \
            --no-restore \
            --verbosity normal \
            --filter "FullyQualifiedName~Architecture" \
            --logger "trx;LogFileName=architecture-tests.trx" \
            --results-directory TestResults/architecture

      - name: Pre-pull Postgres test image
        # Testcontainers-backed tests (Category=Postgres) need this image; retry around registry rate limits.
        run: |
          for attempt in 1 2 3 4 5; do
            docker pull postgres:17-alpine && exit 0
            echo "Pull attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Run backend tests with coverage
        run: dotnet test Quizymode.sln --no-restore --verbosity normal --collect:"XPlat Code Coverage" --settings tests/Quizymode.Api.Tests/coverlet.runsettings --results-directory TestResults/coverage

      - name: Summarize coverage
        id: summarize_coverage
        shell: pwsh
        run: ./scripts/summarize-coverage.ps1 -ResultsDirectory TestResults/coverage -MarkdownOutputPath coverage-summary.md -JsonOutputPath coverage-summary.json -FrontendCoverageJsonPath src/Quizymode.Web/coverage/coverage-summary.json -ArchitectureResultsPath TestResults/architecture/architecture-tests.trx

      - name: Comment on coverage summary
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          COVERAGE_SUMMARY_PATH: ${{ steps.summarize_coverage.outputs.coverage_markdown_path }}
        with:
          script: |
            const fs = require('fs');

            try {
              const marker = '<!-- coverage-summary -->';
              const summaryPath = process.env.COVERAGE_SUMMARY_PATH;
              const summary = summaryPath && fs.existsSync(summaryPath)
                ? fs.readFileSync(summaryPath, 'utf8')
                : 'Coverage summary was not produced.';

              const body = `${marker}
              ${summary}`;

              const { owner, repo } = context.repo;
              const issue_number = context.issue.number;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100
              });

              const existing = comments.find(comment =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker)
              );

              const normalize = text => (text ?? '').replace(/\r\n/g, '\n').trim();
              if (existing && normalize(existing.body) === normalize(body)) {
                console.log(`Comment ${existing.id} already up to date; not rewriting it.`);
                return;
              }

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body
                });
                return;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            } catch (error) {
              console.log(`Skipping coverage summary comment: ${error.message}`);
            }

      - name: Docker metadata
        id: meta
        run: |
          IMAGE_ID="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          echo "image=${IMAGE_ID}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (no push)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./src/Quizymode.Api/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.image }}:ci-${{ github.run_number }}
          build-args: |
            APP_VERSION=${{ steps.app_version.outputs.app_version }}
            SOURCE_REVISION_ID=${{ github.sha }}

      - name: Build and push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./src/Quizymode.Api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            APP_VERSION=${{ steps.app_version.outputs.app_version }}
            SOURCE_REVISION_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # AC 7.8.4: signed-in E2E on an ephemeral Development stack (Postgres service, API, Vite). No Cognito, no secrets.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quizymode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/Quizymode.Web/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix src/Quizymode.Web
          npx playwright install --with-deps chromium

      - name: Create HTTPS dev certificate (the Vite proxy targets https://localhost:8082)
        run: dotnet dev-certs https

      - name: Start API in Development (DevTest scheme on)
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: https://localhost:8082
          APP_Authentication__Cognito__Authority: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_CIDUMMY
          APP_Authentication__Cognito__ClientId: ci-dummy
        run: |
          dotnet run --no-launch-profile --project src/Quizymode.Api/Quizymode.Api.csproj -c Debug > api.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sk https://localhost:8082/health | grep -q Healthy; then echo "API healthy"; exit 0; fi
            sleep 2
          done
          echo "API did not become healthy"; tail -n 80 api.log; exit 1

      - name: Start web dev server with the DevTest identity
        env:
          VITE_DEV_TEST_USER: ci-user
          VITE_COGNITO_USER_POOL_ID: us-east-1_CIDUMMY
          VITE_COGNITO_CLIENT_ID: ci-dummy
          VITE_COGNITO_REGION: us-east-1
        working-directory: src/Quizymode.Web
        run: |
          npm run dev -- --port 7000 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s http://localhost:7000/ > /dev/null; then echo "web healthy"; exit 0; fi
            sleep 2
          done
          echo "web server did not start"; tail -n 80 vite.log; exit 1

      - name: Run E2E tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:7000
        run: npx playwright test --project=e2e-ci

      - name: Upload traces and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-ci-${{ github.run_number }}
          path: |
            playwright/test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload API and web logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-ci-logs-${{ github.run_number }}
          path: |
            api.log
            src/Quizymode.Web/vite.log
          if-no-files-found: warn
